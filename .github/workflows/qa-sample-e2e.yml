name: QA Sample End-to-End

on:
  push:
    branches:
      - feature/qa-sample-stage4-trial-lab
  pull_request:
  workflow_dispatch:

jobs:
  validate-sample-project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate full QA sample
        run: npm run qa:sample
