name: Tolou Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - fix/runtime-load-v1.0.1

jobs:
  runtime-gate-and-build:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Engineering QA gate
        shell: pwsh
        run: npm run qa:sample

      - name: Electron runtime UI smoke gate
        shell: pwsh
        env:
          TOLOU_UI_SMOKE_DIR: ${{ github.workspace }}\artifacts\ui-smoke
          TOLOU_UI_SMOKE_STAGE: all
        run: |
          New-Item -ItemType Directory -Force -Path $env:TOLOU_UI_SMOKE_DIR | Out-Null
          & ".\node_modules\.bin\electron.cmd" "."
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Error "Tolou Electron runtime UI smoke failed with exit code $exitCode"
            exit $exitCode
          }

      - name: Upload runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tolou-Runtime-Smoke
          path: artifacts/ui-smoke/**
          if-no-files-found: warn
          retention-days: 14

      - name: Build Windows installer
        shell: pwsh
        run: npm run dist:win

      - name: Verify installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "Tolou-Concrete-Engineering-Suite-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not produced."
          }
          if ($installer.Length -lt 50MB) {
            throw "Installer output is unexpectedly small: $($installer.Length) bytes"
          }
          Write-Host "INSTALLER_READY $($installer.FullName) $($installer.Length)"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Tolou-Windows-Installer
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
